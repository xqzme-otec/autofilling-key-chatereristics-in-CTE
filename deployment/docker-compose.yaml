# Full stack: frontend -> backend (aggregator) -> model, sessions in Redis.
#   docker compose -f deployment/docker-compose.yaml up --build
# UI: http://localhost:8080   API: http://localhost:8000   model: http://localhost:8001

name: ktru-autofill

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  model:
    build:
      # the image needs ml/ and data/processed/ktru.parquet from the repository root
      context: ..
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    # healthcheck (GET /ready) comes from ml/Dockerfile

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      MODEL_SERVICE_URL: http://model:8001
      REDIS_URL: redis://redis:6379/0
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-30}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-2000}
      SESSION_TTL_S: ${SESSION_TTL_S:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      model:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
